<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title description">
  <title id="title">Stacking two linear maps</title>
  <desc id="description">The lower map B acts on the input indices c and d, and the upper map A has output indices a and b. The two connecting wires carry shared indices i and j, each summed from zero to N minus one.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#216b80"/></marker>
  </defs>
  <rect width="760" height="440" fill="#fff"/>
  <g stroke="#216b80" stroke-width="3" fill="none">
    <path d="M170 365 V320 M290 365 V320 M170 260 V170 M290 260 V170 M170 110 V55 M290 110 V55" marker-end="url(#arrow)"/>
    <rect x="115" y="110" width="230" height="60" rx="6" fill="#edf4f6"/>
    <rect x="115" y="260" width="230" height="60" rx="6" fill="#edf4f6"/>
  </g>
  <g font-family="Georgia, serif" font-size="27" fill="#183444" text-anchor="middle">
    <text x="230" y="149">A</text><text x="230" y="299">B</text>
    <text x="170" y="40">a</text><text x="290" y="40">b</text>
    <text x="148" y="220">i</text><text x="313" y="220">j</text>
    <text x="170" y="397">c</text><text x="290" y="397">d</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="23" fill="#183444">
    <text x="400" y="95">Output indices a, b</text>
    <text x="400" y="198">Sum the shared indices:</text>
    <text x="400" y="234">0 ≤ i, j &lt; N</text>
    <text x="400" y="350">Input indices c, d</text>
  </g>
</svg>
