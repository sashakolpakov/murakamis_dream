<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">The two-to-three move in a triangular bipyramid</title>
  <desc id="desc">The same five vertices P, Q, A, B, C bound both drawings. On the left two tetrahedra share the equatorial triangle ABC, shaded blue. On the right three tetrahedra share the interior edge PQ, shown in orange. Dashed edges lie behind the front faces.</desc>
  <rect width="1000" height="430" fill="#fff"/>
  <style>
    .edge{fill:none;stroke:#173544;stroke-width:2.4;stroke-linejoin:round}
    .back{stroke-dasharray:7 6}
    .label{font:italic 24px Georgia,serif;fill:#173544}
    .caption{font:22px Georgia,serif;fill:#173544;text-anchor:middle}
    .small{font:18px Georgia,serif;fill:#405763;text-anchor:middle}
    .point{fill:#173544}
  </style>
  <g transform="translate(45 20)">
    <text x="205" y="25" class="caption">Two tetrahedra</text>
    <path d="M70 205 L335 215 L230 145 Z" fill="#d5e9ee" stroke="#22738b" stroke-width="2.4"/>
    <path class="edge" d="M205 65 L70 205 L205 330 L335 215 Z M205 65 L230 145"/>
    <path class="edge back" d="M205 330 L230 145"/>
    <g class="point"><circle cx="205" cy="65" r="4"/><circle cx="205" cy="330" r="4"/><circle cx="70" cy="205" r="4"/><circle cx="335" cy="215" r="4"/><circle cx="230" cy="145" r="4"/></g>
    <text class="label" x="216" y="64">P</text><text class="label" x="216" y="350">Q</text>
    <text class="label" x="42" y="210">A</text><text class="label" x="346" y="222">B</text><text class="label" x="240" y="143">C</text>
    <text class="small" x="205" y="393">Shared interior face ABC</text>
  </g>
  <text x="500" y="218" class="caption" style="font-size:36px">↔</text>
  <g transform="translate(545 20)">
    <text x="205" y="25" class="caption">Three tetrahedra</text>
    <path class="edge" d="M205 65 L70 205 L205 330 L335 215 Z M70 205 L335 215 M205 65 L230 145"/>
    <path class="edge back" d="M70 205 L230 145 L335 215 M205 330 L230 145"/>
    <path d="M205 65 L205 330" stroke="#b66a25" stroke-width="4"/>
    <g class="point"><circle cx="205" cy="65" r="4"/><circle cx="205" cy="330" r="4"/><circle cx="70" cy="205" r="4"/><circle cx="335" cy="215" r="4"/><circle cx="230" cy="145" r="4"/></g>
    <text class="label" x="216" y="64">P</text><text class="label" x="216" y="350">Q</text>
    <text class="label" x="42" y="210">A</text><text class="label" x="346" y="222">B</text><text class="label" x="240" y="143">C</text>
    <text class="small" x="205" y="393">Shared interior edge PQ</text>
  </g>
</svg>
