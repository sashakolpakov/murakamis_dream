<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Boundary variation as a graph energy</title>
  <desc id="desc">A schematic weighted graph with boundary vertices A and C and two interior vertices i and j. The boundary potentials are one at A and zero at C. The interior potentials minimize the sum over edges of conductance times squared potential difference. This minimum is the second derivative of the exterior pressure.</desc>
  <rect width="960" height="400" fill="white"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#183b49">
    <text x="480" y="40" text-anchor="middle" font-size="27">Changing one boundary weight</text>
    <g stroke="#397488" stroke-width="3" fill="none">
      <path d="M100 195 L295 100 L490 195 L295 290 Z"/>
      <path d="M295 100 L295 290"/>
    </g>
    <g fill="#fff" stroke="#397488" stroke-width="2.5">
      <circle cx="295" cy="100" r="10"/>
      <circle cx="295" cy="290" r="10"/>
    </g>
    <g fill="#b76820" stroke="#b76820" stroke-width="2">
      <circle cx="100" cy="195" r="10"/>
      <circle cx="490" cy="195" r="10"/>
    </g>
    <g font-size="23" text-anchor="middle">
      <text x="100" y="165">A</text>
      <text x="100" y="239">potential 1</text>
      <text x="490" y="165">C</text>
      <text x="490" y="239">potential 0</text>
      <text x="295" y="80">i</text>
      <text x="295" y="325">j</text>
      <text x="323" y="198" font-style="italic">g<tspan baseline-shift="sub" font-size="16">ij</tspan></text>
    </g>
    <g font-size="22">
      <text x="590" y="105">Vertices represent face variables.</text>
      <text x="590" y="149">An edge carries a positive</text>
      <text x="590" y="179">Hessian conductance.</text>
      <text x="590" y="225">The interior potentials adjust</text>
      <text x="590" y="255">to minimize the total energy.</text>
      <text x="590" y="309">The minimum equals F″(z).</text>
    </g>
    <text x="480" y="379" text-anchor="middle" font-size="20">Schematic response graph; the source determines its vertices and conductances.</text>
  </g>
</svg>
