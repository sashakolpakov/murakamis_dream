<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">The requirements of a volume proof</title>
  <desc id="desc">An exact decomposition of the knot invariant produces a geometric contribution and a remainder. A nonzero asymptotic and a strict remainder estimate determine the quantum growth rate. Identifying the critical value with the hyperbolic volume is a separate geometric proof. Together they give the volume equality for the original invariant.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#315869" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1000" height="680" fill="white"/>
  <g fill="none" stroke="#315869" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M500 105 L500 130 L255 130 L255 158"/>
    <path d="M500 130 L745 130 L745 158"/>
    <path d="M255 300 L255 330 L500 330 L500 355"/>
    <path d="M745 300 L745 330 L500 330" marker-end="none"/>
    <path d="M500 438 L500 470 L255 470 L255 497"/>
    <path d="M530 536 L470 536"/>
  </g>
  <g stroke="#28748a" stroke-width="1.8" fill="#f3f7f8">
    <rect x="200" y="25" width="600" height="80" rx="10"/>
    <rect x="40" y="160" width="430" height="140" rx="10"/>
    <rect x="530" y="160" width="430" height="140" rx="10"/>
    <rect x="280" y="357" width="440" height="80" rx="10"/>
    <rect x="530" y="497" width="430" height="78" rx="10"/>
    <rect x="40" y="497" width="430" height="158" rx="10" fill="#eef5ee" stroke="#4d7956"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#183b49" text-anchor="middle">
    <text x="500" y="58" font-size="24">Exact decomposition of the original invariant</text>
    <text x="500" y="88" font-size="22">K<tspan baseline-shift="sub" font-size="16">N</tspan><tspan baseline-shift="baseline"> = G</tspan><tspan baseline-shift="sub" font-size="16">N</tspan><tspan baseline-shift="baseline"> + R</tspan><tspan baseline-shift="sub" font-size="16">N</tspan></text>
    <text x="255" y="194" font-size="25">Geometric contribution</text>
    <text x="255" y="230" font-size="21">Nonzero leading coefficient</text>
    <text x="255" y="265" font-size="21">Controlled asymptotic and error</text>
    <text x="745" y="194" font-size="25">Complementary contribution</text>
    <text x="745" y="230" font-size="21">A strict bound for the whole remainder</text>
    <text x="745" y="265" font-size="21">Original phases and constraints retained</text>
    <text x="500" y="390" font-size="24">The invariant has the geometric rate</text>
    <text x="500" y="421" font-size="20">The remainder cannot cancel its leading term</text>
    <text x="745" y="530" font-size="23">Geometric identification</text>
    <text x="745" y="558" font-size="19">Actual topology, peripheral curves, and metric</text>
    <text x="255" y="537" font-size="25">Volume equality</text>
    <text x="255" y="575" font-size="21">For the original knot invariant</text>
    <text x="255" y="611" font-size="21">under the theorem’s stated hypotheses</text>
  </g>
</svg>
